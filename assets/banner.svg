<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Shubham Mallick — Python backend and applied AI developer">
  <title>Shubham Mallick — Python backend × applied intelligence</title>
  <defs>
    <linearGradient id="mar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A1F2B"/>
      <stop offset="55%" stop-color="#A8323F"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7A1F2B" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#7A1F2B" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#7A1F2B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#5A1520"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7A1F2B" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="#F3EEE3"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="905" cy="180" rx="330" ry="260" fill="url(#glow)"/>

    <!-- ── orbit rings ─────────────────────────────────────────── -->
    <g transform="translate(905 180)">
      <g>
        <ellipse cx="0" cy="0" rx="196" ry="66" fill="none" stroke="#7A1F2B" stroke-opacity="0.32" stroke-width="1.6"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="0" cy="0" rx="152" ry="108" fill="none" stroke="#C8102E" stroke-opacity="0.26" stroke-width="1.4"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="38s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="0" cy="0" rx="112" ry="150" fill="none" stroke="#1E40AF" stroke-opacity="0.20" stroke-width="1.2"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="52s" repeatCount="indefinite"/>
      </g>

      <!-- orbiting sparks -->
      <circle cx="196" cy="0" r="6" fill="#7A1F2B">
        <animateMotion dur="26s" repeatCount="indefinite" path="M196,0 a196,66 0 1,0 0.01,0"/>
      </circle>
      <circle cx="0" cy="-108" r="5" fill="#C8102E">
        <animateMotion dur="38s" repeatCount="indefinite" path="M0,-108 a152,108 0 1,1 -0.01,0"/>
      </circle>
      <circle cx="112" cy="0" r="4.5" fill="#1E40AF">
        <animateMotion dur="52s" repeatCount="indefinite" path="M112,0 a112,150 0 1,0 -0.01,0"/>
      </circle>
      <circle cx="-196" cy="0" r="3.5" fill="#C8102E" opacity="0.75">
        <animateMotion dur="26s" begin="-13s" repeatCount="indefinite" path="M196,0 a196,66 0 1,0 0.01,0"/>
      </circle>

      <!-- pulsing halo -->
      <circle cx="0" cy="0" r="74" fill="url(#glow)">
        <animate attributeName="r" values="70;82;70" dur="4.4s" repeatCount="indefinite"/>
      </circle>

      <!-- the core -->
      <g>
        <polygon points="0,-54 46,-27 46,27 0,54 -46,27 -46,-27" fill="url(#core)"/>
        <polygon points="0,-54 46,-27 46,27 0,54 -46,27 -46,-27" fill="none" stroke="#F3EEE3" stroke-opacity="0.55" stroke-width="1.4"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.7">
        <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#F3EEE3" stroke-opacity="0.8" stroke-width="1.2"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
      </g>
      <circle cx="0" cy="0" r="10" fill="#F3EEE3">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- floating dust -->
    <circle cx="700" cy="70" r="2.6" fill="#7A1F2B" opacity="0.45">
      <animate attributeName="cy" values="70;44;70" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="300" r="2" fill="#C8102E" opacity="0.4">
      <animate attributeName="cy" values="300;270;300" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1115" cy="90" r="3" fill="#7A1F2B" opacity="0.35">
      <animate attributeName="cy" values="90;58;90" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="252" r="2.2" fill="#1E40AF" opacity="0.4">
      <animate attributeName="cy" values="252;226;252" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="320" r="2.4" fill="#7A1F2B" opacity="0.3">
      <animate attributeName="cy" values="320;296;320" dur="10.5s" repeatCount="indefinite"/>
    </circle>

    <!-- ── type ────────────────────────────────────────────────── -->
    <text x="72" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="4.5" fill="#8A756E">SM://PORTFOLIO</text>
    <text x="72" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-2" fill="#2B1418">Shubham Mallick</text>
    <text x="72" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" fill="#7A1F2B">Python backend <tspan fill="#B7A99C">×</tspan> applied intelligence</text>
    <text x="72" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#8A756E">SHIPPED — NOT JUST BUILT</text>
    <rect x="72" y="298" width="104" height="3" rx="1.5" fill="#7A1F2B">
      <animate attributeName="width" values="104;208;104" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text x="1128" y="330" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#B7A99C">KOLKATA · IN</text>
  </g>
</svg>
