<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6" viewBox="0 0 1200 6" role="img" aria-label="">
  <defs>
    <linearGradient id="smk-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A1F2B"/>
      <stop offset="45%" stop-color="#C8102E"/>
      <stop offset="80%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="smk-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBF8F1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FBF8F1" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FBF8F1" stop-opacity="0"/>
    </linearGradient>
    <mask id="smk-m">
      <rect width="1200" height="6" fill="#000"/>
      <rect width="220" height="6" fill="#fff">
        <animate attributeName="x" values="-220;1200" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>
  <rect width="1200" height="6" rx="3" fill="url(#smk-rule)"/>
  <rect width="1200" height="6" rx="3" fill="url(#smk-shine)" mask="url(#smk-m)"/>
</svg>
